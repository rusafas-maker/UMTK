<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УМТК - Почему выбирают нас</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .why-section {
            padding: 80px 0;
            background: #f8fafc;
        }
        
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
        }
        
        .section-header {
            text-align: center;
            margin-bottom: 64px;
        }
        
        .section-title {
            font-size: 36px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
        }
        
        .title-underline {
            width: 80px;
            height: 6px;
            background: linear-gradient(to right, #8B3A1A, #C44921, #DC5528);
            margin: 0 auto;
            border-radius: 9999px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }
        
        .feature-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
            transition: all 0.3s;
        }
        
        .feature-card:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(-2px);
        }
        
        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .icon-copper {
            background: linear-gradient(to bottom right, #8B3A1A, #C44921, #DC5528);
        }
        
        .icon-green {
            background: linear-gradient(to bottom right, #059669, #10b981);
        }
        
        .icon-blue {
            background: linear-gradient(to bottom right, #2563eb, #3b82f6);
        }
        
        .icon {
            width: 32px;
            height: 32px;
            color: white;
        }
        
        .feature-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #0f172a;
            text-align: center;
        }
        
        .feature-description {
            color: #475569;
            text-align: center;
            line-height: 1.75;
        }
        
        @media (max-width: 768px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
            
            .why-section {
                padding: 60px 0;
            }
            
            .container {
                padding: 0 16px;
            }
            
            .section-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <section class="why-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Почему выбирают УМТК</h2>
                <div class="title-underline"></div>
            </div>
            
            <div class="features-grid">
                <!-- Feature 1 -->
                <div class="feature-card">
                    <div class="icon-wrapper icon-copper">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"/>
                        </svg>
                    </div>
                    <h3 class="feature-title">Клиентоориентированность</h3>
                    <p class="feature-description">Гибкое ценообразование и индивидуальные условия отсрочки платежей</p>
                </div>
                
                <!-- Feature 2 -->
                <div class="feature-card">
                    <div class="icon-wrapper icon-green">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                    </div>
                    <h3 class="feature-title">Качество от КМЭЗ</h3>
                    <p class="feature-description">Продукция второго крупнейшего производителя в России с лучшим соотношением цена-качество</p>
                </div>
                
                <!-- Feature 3 -->
                <div class="feature-card">
                    <div class="icon-wrapper icon-blue">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <h3 class="feature-title">Точно в срок</h3>
                    <p class="feature-description">Гарантированные сроки поставки без переносов и отписок</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
