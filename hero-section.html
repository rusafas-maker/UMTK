<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УМТК - Hero Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .hero {
            position: relative;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }
        
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom right, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.9));
            z-index: 10;
        }
        
        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 20;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
            text-align: center;
        }
        
        .hero-title {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.1;
        }
        
        .hero-subtitle {
            font-size: 24px;
            margin-bottom: 40px;
            color: #f1f5f9;
            max-width: 768px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hero-buttons {
            display: flex;
            flex-direction: row;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(to right, #8B3A1A, #C44921, #DC5528);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .btn-primary:hover {
            background: linear-gradient(to right, #7A2F15, #B33E1C, #C94D23);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .arrow-icon {
            width: 20px;
            height: 20px;
        }
        
        @media (max-width: 768px) {
            .hero-title {
                font-size: 48px;
            }
            
            .hero-subtitle {
                font-size: 20px;
            }
            
            .hero-buttons {
                flex-direction: column;
            }
            
            .hero-content {
                padding: 0 16px;
            }
        }
        
        @media (max-width: 640px) {
            .hero {
                height: 500px;
            }
            
            .hero-title {
                font-size: 36px;
            }
            
            .hero-subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-overlay"></div>
        <img src="https://images.unsplash.com/photo-1587293852726-70cdb56c2866?w=1920&q=80" alt="Производство медной катанки" class="hero-image">
        
        <div class="hero-content">
            <h1 class="hero-title">
                Поставки медной продукции<br>высокого качества
            </h1>
            <p class="hero-subtitle">
                Медная катанка М001 и медные катоды М00к от надежного поставщика УМТК
            </p>
            <div class="hero-buttons">
                <a href="/products" class="btn-primary">
                    Наша продукция
                    <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </a>
                <a href="/contact" class="btn-secondary">
                    Связаться с нами
                </a>
            </div>
        </div>
    </section>
</body>
</html>
